<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติว TOEIC ฟรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column of soft "sticker" cards on a dotted pastel page; colorful A–D bubbles are the motif. */
:root{
  --paper:#fff6fa; --dot:#f6dbe8; --card:#ffffff; --ink:#3d2c4f; --muted:#86759a; --line:#f1dceb;
  --accent:#ff6f9f; --accent-ink:#ffffff; --accent-soft:#ffe3ee; --mark:#ffc93c;
  --sky:#cfe7ff; --sky-ink:#2d6aa6; --mint:#cff3e4; --mint-ink:#1f7a5a; --butter:#fff0bf; --butter-ink:#8a6400; --pink:#ffd9e7; --pink-ink:#b8336a;
  --good:#22a06b; --good-bg:#e2f8ee; --bad:#e2486a; --bad-bg:#ffe6ec;
  --shadow:0 5px 0 #f3d4e3;
  --display:"Nunito","Kanit",system-ui,sans-serif;
  --body:"Nunito","Prompt",system-ui,sans-serif;
  --num:"Nunito",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#221a2c; --dot:#2f2540; --card:#2e2440; --ink:#f7eefc; --muted:#bba9cf; --line:#45375a;
    --accent:#ff8db5; --accent-ink:#2a0f1d; --accent-soft:#4a2a40; --mark:#ffd166;
    --sky:#243c58; --sky-ink:#a8d2ff; --mint:#1f4438; --mint-ink:#9be8c8; --butter:#4a3d1c; --butter-ink:#ffe08a; --pink:#4d2640; --pink-ink:#ffb3cf;
    --good:#6fe0a8; --good-bg:#173b2d; --bad:#ff8fa6; --bad-bg:#4a1f2b;
    --shadow:0 5px 0 #18111f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#221a2c; --dot:#2f2540; --card:#2e2440; --ink:#f7eefc; --muted:#bba9cf; --line:#45375a;
  --accent:#ff8db5; --accent-ink:#2a0f1d; --accent-soft:#4a2a40; --mark:#ffd166;
  --sky:#243c58; --sky-ink:#a8d2ff; --mint:#1f4438; --mint-ink:#9be8c8; --butter:#4a3d1c; --butter-ink:#ffe08a; --pink:#4d2640; --pink-ink:#ffb3cf;
  --good:#6fe0a8; --good-bg:#173b2d; --bad:#ff8fa6; --bad-bg:#4a1f2b;
  --shadow:0 5px 0 #18111f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.7}
.wrap{max-width:660px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;gap:14px}
.mascot{width:64px;height:64px;flex:none}
@media (prefers-reduced-motion:no-preference){.mascot{animation:bob 3.2s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-4px) rotate(-3deg)}}}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.logo{display:flex;gap:4px}
.logo i{font-style:normal;font-family:var(--num);font-weight:900;font-size:12px;width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.logo i:nth-child(1){background:var(--pink);color:var(--pink-ink)} .logo i:nth-child(2){background:var(--sky);color:var(--sky-ink)}
.logo i:nth-child(3){background:var(--mint);color:var(--mint-ink)} .logo i:nth-child(4){background:var(--butter);color:var(--butter-ink)}
h1{font-family:var(--display);font-weight:700;font-size:26px;margin:0;line-height:1.25;text-wrap:balance}
h1 em{font-style:normal;color:var(--accent)}
.tagline{font-size:14px;color:var(--muted)}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0;line-height:1.4;text-wrap:balance}
h3{font-family:var(--display);font-weight:600}
p{margin:0}
strong{font-weight:700}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.admin{border-color:var(--mark)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:3px 12px;border:2px solid currentColor}
.pill.on{color:var(--good);background:var(--good-bg)}
.pill.off{color:var(--bad);background:var(--bad-bg)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:11px 22px;font-weight:700;font-family:var(--display);box-shadow:0 4px 0 color-mix(in srgb, var(--accent) 70%, #000);transition:transform .1s, box-shadow .1s}
.btn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--accent) 70%, #000)}
.btn.ghost{background:var(--card);color:var(--accent);border:2px solid var(--accent);box-shadow:0 4px 0 var(--accent-soft);padding:9px 20px}
.btn.danger{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb, var(--bad) 70%, #000)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:3px}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:10px 12px;flex:1;min-width:0}
.sets{display:flex;flex-direction:column;gap:12px}
.set{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px;width:100%;box-shadow:0 4px 0 var(--line);transition:transform .12s, border-color .12s}
.set:hover{border-color:var(--accent);transform:translateY(-2px)}
.set .t{font-family:var(--display);font-weight:600;line-height:1.4}
.set .d{color:var(--muted);font-size:14px}
.set .grow{flex:1;min-width:0}
.set .best{font-family:var(--num);font-weight:800;font-size:13px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--accent-soft);border-radius:999px;padding:3px 10px}
.set.fullset{border-color:var(--accent);background:linear-gradient(135deg,var(--card) 60%,var(--accent-soft))}
.set .num,.parthead .num{font-family:var(--num);font-weight:900;font-size:13px;color:var(--sky-ink);background:var(--sky);border-radius:999px;padding:5px 11px;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:2px 4px 4px}
.sechead h2{font-size:22px;background:linear-gradient(transparent 62%, var(--mark) 62%, var(--mark) 92%, transparent 92%);padding:0 4px}
.parthead{display:flex;gap:12px;align-items:center;margin-top:8px;padding:0 4px}
.parthead .t{font-family:var(--display);font-weight:600;line-height:1.4}
.parthead .d{color:var(--muted);font-size:14px}
.parthead .grow{flex:1;min-width:0}
.pill.soon{color:var(--muted);white-space:nowrap}
.scgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{border-radius:16px;padding:12px;min-width:0;background:var(--sky)}
.sc:nth-child(2){background:var(--mint)} .sc:nth-child(3){background:var(--butter)}
.sc .muted{font-size:13px;line-height:1.4;color:var(--ink);opacity:.75}
.scn{font-family:var(--num);font-weight:900;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.35}
.scn small{font-size:12px;font-weight:700;opacity:.65}
@media (max-width:420px){.scgrid{grid-template-columns:1fr}}
.scgrid.g2{grid-template-columns:repeat(2,1fr)} .scgrid.g1{grid-template-columns:1fr}
.pill.timer{font-family:var(--num);font-weight:800;color:var(--accent);background:var(--accent-soft);font-variant-numeric:tabular-nums;margin-left:auto}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:column;align-items:center;background:transparent;border:0;border-radius:999px;padding:8px 6px;color:var(--muted);transition:background .15s}
.tab .tt{font-family:var(--display);font-weight:700;font-size:17px;color:var(--ink);line-height:1.3}
.tab .td{font-size:12px;line-height:1.3;text-align:center}
.tab.on{background:var(--accent)}
.tab.on .tt,.tab.on .td{color:var(--accent-ink)}
.tab:not(.on):hover{background:var(--accent-soft)}
@media (max-width:420px){.tabs{border-radius:22px}.tab{border-radius:16px}}
.card.note{border-color:var(--mint);background:linear-gradient(135deg,var(--card) 55%,var(--mint))}
.row.confirm{background:var(--bad-bg);border-radius:16px;padding:12px}
.lesson h3,.card h3{font-size:17px;margin:4px 0 0}
.rules{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.rules li{background:var(--paper);border-radius:14px;padding:8px 12px 8px 36px;position:relative}
.rules li::before{content:"";position:absolute;left:13px;top:17px;width:10px;height:10px;border-radius:999px;background:var(--accent)}
.rules.ex li::before{background:var(--sky-ink)}
.rules strong{color:var(--accent)}
.ftag{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;line-height:1.6;vertical-align:1px}
.ftag.hot{background:var(--pink);color:var(--pink-ink)} .ftag.warm{background:var(--butter);color:var(--butter-ink)} .ftag.cool{background:var(--sky);color:var(--sky-ink)}
.best.good{color:var(--good)!important;background:var(--good-bg)!important} .best.weak{color:var(--bad)!important;background:var(--bad-bg)!important}
.bar{height:10px;background:var(--accent-soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 8px,color-mix(in srgb, var(--accent) 80%, #fff) 8px 16px);border-radius:999px}
.passage{background:var(--paper);border:2px dashed var(--line);border-radius:16px;padding:14px;white-space:pre-wrap;font-size:15px;line-height:1.65}
.fig{border:2px solid var(--line);border-radius:18px;background:var(--paper);padding:8px;color:var(--ink)}
.fig img{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;border-radius:12px}
.fig svg{display:block;width:100%;height:auto;max-height:240px}
.q{font-size:18px;font-weight:600;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 12px;width:100%;box-shadow:0 3px 0 var(--line);transition:transform .1s, border-color .1s}
.opt .b{font-family:var(--num);font-weight:900;font-size:15px;border-radius:999px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
.opt:nth-child(1) .b{background:var(--pink);color:var(--pink-ink)} .opt:nth-child(2) .b{background:var(--sky);color:var(--sky-ink)}
.opt:nth-child(3) .b{background:var(--mint);color:var(--mint-ink)} .opt:nth-child(4) .b{background:var(--butter);color:var(--butter-ink)}
.opt:not(:disabled):hover{border-color:var(--accent);transform:translateY(-1px)}
.opt:disabled{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .b{background:var(--accent)!important;color:var(--accent-ink)!important}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .b{background:var(--good)!important;color:#fff!important}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .b{background:var(--bad)!important;color:#fff!important}
.exp{border-radius:16px;padding:14px;border:2px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:6px}
.exp .v{font-family:var(--display);font-weight:700;font-size:17px}
.exp .v.ok{color:var(--good)} .exp .v.no{color:var(--bad)}
.exp .v.ok::before{content:"✓ "} .exp .v.no::before{content:"✗ "}
.score{font-family:var(--num);font-size:52px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--accent)}
.miss{background:var(--paper);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.center{text-align:center;align-items:center;padding:36px 16px}
footer.foot{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>

  <header class="top">
    <svg class="mascot" viewBox="0 0 64 64" aria-hidden="true">

</div>

var P7C = "WANTED: PART-TIME RECEPTIONIST\n\nLakeview Dental Clinic is seeking a friendly, organized receptionist to work afternoons from Monday to Thursday. Duties include answering phones, scheduling appointments, and greeting patients.\n\nPrevious experience in a medical office is preferred but not required. Training will be provided during the first two weeks.\n\nTo apply, send your résumé to the clinic manager by March 20. Interviews will be held the following week.";

   e:"ช่องว่างอยู่ระหว่าง is กับ being renovated ต้องใช้กริยาวิเศษณ์มาขยายกริยา จึงตอบ currently (ขณะนี้) ส่วน currency แปลว่า สกุลเงิน"},
  {q:"Sales of the new model were ------- higher than the company had expected.", o:["significant","significance","significantly","signify"], a:2,
   e:"คำที่ขยายคำคุณศัพท์ higher ต้องเป็นกริยาวิเศษณ์ จึงตอบ significantly แปลว่า ยอดขายสูงกว่าที่คาดไว้อย่างมีนัยสำคัญ"},
  {q:"The new software is much ------- to use than the previous version.", o:["easy","easier","easiest","easily"], a:1,
   e:"เห็น than ให้นึกถึงการเปรียบเทียบขั้นกว่า และ much ใช้ขยายขั้นกว่าได้ จึงตอบ easier"},
  {q:"Please ------- the attached document before the meeting.", o:["review","reviewing","reviewed","to review"], a:0,
   e:"ประโยคคำสั่งหรือขอร้องขึ้นต้นด้วย Please ตามด้วยกริยาช่องที่ 1 จึงตอบ review แปลว่า กรุณาตรวจทานเอกสารแนบก่อนประชุม"},
  {q:"Applicants ------- have at least three years of experience will be given priority.", o:["which","whose","who","whom"], a:2,
   e:"คำนามข้างหน้าเป็นคน (Applicants) และช่องว่างทำหน้าที่ประธานของ have จึงใช้ who ส่วน whom ใช้เป็นกรรม และ whose ต้องมีคำนามตามหลัง"},
  {q:"The manager asked that the report ------- completed by the end of the week.", o:["is","be","was","being"], a:1,
   e:"หลังกริยาแสดงการขอหรือสั่ง เช่น ask, request, suggest + that ให้ใช้กริยาช่องที่ 1 ไม่ผัน (subjunctive) จึงตอบ be"},
  {q:"By the time the director arrives, the staff ------- the presentation materials.", o:["prepare","prepared","will have prepared","had prepared"], a:2,
   e:"By the time + Present Simple บอกเวลาในอนาคต ประโยคหลักจึงใช้ Future Perfect (will have + V3) หมายถึงจะเตรียมเสร็จก่อนผู้อำนวยการมาถึง"}
 ]},
 {id:"p5b", part:"Part 5", title:"เติมประโยคให้สมบูรณ์ ชุดที่ 2", desc:"บุพบท คำเชื่อม และคำศัพท์", items:[
  {q:"Ms. Tanaka is responsible ------- training all new employees.", o:["to","for","with","at"], a:1,
   e:"สำนวน be responsible for + V-ing แปลว่า รับผิดชอบเรื่อง… เป็นคู่คำที่ออกสอบบ่อย ต้องจำทั้งชุด"},
  {q:"------- the heavy rain, the outdoor event was held as scheduled.", o:["Although","Despite","Because","Unless"], a:1,
   e:"หลังช่องว่างเป็นคำนามวลี (the heavy rain) ไม่ใช่ประโยค จึงใช้บุพบท Despite ส่วน Although ต้องตามด้วยประโยคที่มีประธานและกริยา"},
  {q:"Customers who order before noon will receive their items ------- two business days.", o:["within","among","since","until"], a:0,
   e:"within + ระยะเวลา แปลว่า ภายใน… จึงได้ความว่า จะได้รับสินค้าภายในสองวันทำการ"},
  {q:"Mr. Lee has worked at the company ------- 2015.", o:["for","during","since","from"], a:2,
   e:"Present Perfect (has worked) + จุดเริ่มต้นของเวลา ใช้ since ส่วน for ใช้กับระยะเวลา เช่น for ten years"},
  {q:"Neither the supervisor ------- the technicians were aware of the schedule change.", o:["or","and","nor","but"], a:2,
   e:"neither … nor … เป็นคำเชื่อมคู่ แปลว่า ไม่ทั้ง…และ… ส่วน or ใช้คู่กับ either"},
  {q:"The company's profits increased ------- 15 percent last quarter.", o:["by","at","on","to"], a:0,
   e:"increase by + จำนวน บอกปริมาณที่เพิ่มขึ้น แปลว่า กำไรเพิ่มขึ้น 15 เปอร์เซ็นต์ ส่วน increase to บอกระดับที่ไปถึง"},
  {q:"The shipment was delayed ------- a problem at the customs office.", o:["because","due to","so that","in order"], a:1,
   e:"หลังช่องว่างเป็นคำนามวลี จึงใช้ due to (เนื่องจาก) ส่วน because ต้องตามด้วยประโยค ถ้าจะใช้กับคำนามต้องเป็น because of"},
  {q:"Ms. Park will be promoted ------- regional manager next month.", o:["as","to","for","into"], a:1,
   e:"be promoted to + ตำแหน่ง แปลว่า ได้เลื่อนตำแหน่งเป็น… เป็นคู่คำที่พบบ่อยในบริบทงานบุคคล"},
  {q:"The factory is equipped with machines ------- of producing 500 units per hour.", o:["capable","able","possible","skilled"], a:0,
   e:"capable of + V-ing แปลว่า สามารถ… ส่วน able ต้องใช้กับ to + V1 จึงดูจากบุพบท of ที่ตามหลังช่องว่าง"}
 ]},
 {id:"p6", part:"Part 6", title:"เติมข้อความในเนื้อเรื่อง", desc:"ประกาศและจดหมายธุรกิจ 2 เรื่อง", items:[
  {p:P6A, q:"ช่องว่างที่ (1)", o:["take","spend","pass","keep"], a:0,
   e:"งานหรือกิจกรรม + take + ระยะเวลา แปลว่า ใช้เวลา… ส่วน spend ต้องมีคนเป็นประธาน เช่น We spent six hours"},
  {p:P6A, q:"ช่องว่างที่ (2) เลือกประโยคที่เหมาะสมที่สุด", o:["The elevator was installed ten years ago.","Building A has the largest cafeteria on campus.","The service elevator can carry up to ten people at a time.","Employees should submit their timesheets on Friday."], a:2,
   e:"ประโยคก่อนหน้าแนะนำให้ใช้ลิฟต์ขนของ ประโยคที่ต่อเนื่องที่สุดจึงเป็นข้อมูลเพิ่มเติมของลิฟต์ตัวนั้น คือบรรทุกได้ครั้งละไม่เกินสิบคน ตัวเลือกอื่นไม่เกี่ยวกับเรื่องที่กำลังพูดถึง"},
  {p:P6A, q:"ช่องว่างที่ (3)", o:["convenient","inconvenient","conveniently","inconvenience"], a:3,
   e:"หลัง any ต้องเป็นคำนาม และสำนวน We apologize for any inconvenience แปลว่า ขออภัยในความไม่สะดวก พบบ่อยมากในประกาศ"},
  {p:P6B, q:"ช่องว่างที่ (1)", o:["temporary","temporarily","temporariness","temporaries"], a:1,
   e:"ช่องว่างอยู่หลัง is และขยาย out of stock จึงใช้กริยาวิเศษณ์ temporarily แปลว่า สินค้าหมดชั่วคราว"},
  {p:P6B, q:"ช่องว่างที่ (2)", o:["Alternatively","Therefore","For example","Similarly"], a:0,
   e:"ประโยคก่อนหน้าบอกว่าให้รอสินค้าล็อตใหม่ ประโยคนี้เสนอทางเลือกอื่น คือเปลี่ยนรุ่นหรือขอเงินคืน จึงใช้ Alternatively (อีกทางเลือกหนึ่ง)"},
  {p:P6B, q:"ช่องว่างที่ (3)", o:["prefers","preferring","prefer","to prefer"], a:2,
   e:"ประธานคือ you และเป็นข้อเท็จจริงปัจจุบัน จึงใช้กริยาช่องที่ 1 ไม่เติม s คือ prefer แปลว่า ตัวเลือกที่คุณต้องการ"}
 ]},
 {id:"p7", part:"Part 7", title:"อ่านจับใจความ", desc:"ประกาศและอีเมล 2 เรื่อง", items:[
  {p:P7A, q:"What is the purpose of the notice?", o:["To announce changes to library services","To ask members for donations","To introduce a new librarian","To explain membership fees"], a:0,
   e:"ประกาศแจ้งเรื่องขยายเวลาเปิดทำการและระบบจองห้องออนไลน์ ซึ่งเป็นการเปลี่ยนแปลงบริการของห้องสมุด ไม่มีการพูดถึงเงินบริจาค บรรณารักษ์ใหม่ หรือค่าสมาชิก"},
  {p:P7A, q:"What is indicated about weekend hours?", o:["They will be extended.","They will be shortened.","The library will close on weekends.","They will stay the same."], a:3,
   e:"ในเนื้อเรื่องเขียนว่า Weekend hours … will remain unchanged ซึ่ง remain unchanged มีความหมายเดียวกับ stay the same ข้อสอบมักเปลี่ยนคำแบบนี้ (paraphrase)"},
  {p:P7A, q:"How long can a study room be reserved at one time?", o:["One hour","Two hours","Seven hours","Seven days"], a:1,
   e:"คำตอบอยู่ที่ Each reservation is limited to two hours ส่วน seven days คือจำนวนวันที่จองล่วงหน้าได้ เป็นตัวลวงที่ต้องระวัง"},
  {p:P7B, q:"Why was the client visit changed?", o:["The factory will be closed on Wednesday.","Emily is not available on Wednesday.","The clients' flight was rescheduled.","The restaurant was fully booked."], a:2,
   e:"ย่อหน้าแรกบอกเหตุผลตรง ๆ ว่า because their flight was rescheduled คือเที่ยวบินของลูกค้าถูกเลื่อน"},
  {p:P7B, q:"What is Emily asked to do about lunch?", o:["Order food to be delivered to the office","Reserve a table at a restaurant with vegetarian dishes","Cancel the lunch meeting","Invite more staff members"], a:1,
   e:"Daniel ขอให้ book a table for six และให้แน่ใจว่าร้านมีอาหารสำหรับคนกินมังสวิรัติ book กับ reserve มีความหมายเหมือนกัน"},
  {p:P7B, q:"When should Emily send the updated schedule?", o:["On Monday morning","On Wednesday","On Thursday at 10:00 A.M.","By Tuesday afternoon"], a:3,
   e:"ย่อหน้าสุดท้ายเขียนว่า send me the updated schedule by Tuesday afternoon ส่วน Thursday 10:00 A.M. คือเวลาพาชมโรงงาน ไม่ใช่กำหนดส่งตาราง"}
 ]},
 {id:"p5c", part:"Part 5", items:[
  {q:"Guests attending the annual awards dinner will be offered free ------- from the hotel to the convention center.", o:["transported","transports","transporting","transportation"], a:3,
   e:"หลังคำคุณศัพท์ free ต้องเป็นคำนาม จึงตอบ transportation (การเดินทาง รถรับส่ง) ท้ายคำ -tion เป็นสัญญาณของคำนาม"},
  {q:"Ms. Alvarez submitted a proposal that ------- the benefits of switching to solar energy.", o:["outlined","attended","hired","rented"], a:0,
   e:"ข้อนี้วัดคำศัพท์ outline แปลว่า สรุปประเด็นสำคัญ เข้ากับ proposal และ benefits ส่วน attend (เข้าร่วม) hire (จ้าง) rent (เช่า) ใช้กับ benefits ไม่ได้"},
  {q:"The updated manual is available only to ------- technicians.", o:["certify","certified","certification","certifying"], a:1,
   e:"ช่องว่างอยู่หน้าคำนาม technicians ต้องใช้คำคุณศัพท์ ช่างเป็นฝ่ายถูกรับรอง จึงใช้รูป V3 คือ certified แปลว่า ช่างที่ได้รับการรับรอง"},
  {q:"Several residents raised ------- about the noise from the construction site.", o:["receipts","rewards","concerns","shortcuts"], a:2,
   e:"raise concerns about เป็นคู่คำ แปลว่า แสดงความกังวลเรื่อง… ตัวเลือกอื่นคือ ใบเสร็จ รางวัล ทางลัด ไม่เข้ากับเรื่องเสียงดังจากไซต์ก่อสร้าง"},
  {q:"The city council ------- a new parking policy at next Tuesday's meeting.", o:["discussed","discussing","will discuss","to discuss"], a:2,
   e:"next Tuesday บอกเวลาในอนาคต จึงใช้ will + V1 ส่วน discussing และ to discuss ทำหน้าที่กริยาหลักของประโยคไม่ได้"},
  {q:"If you have ------- questions about your invoice, please contact our billing office.", o:["much","any","every","each"], a:1,
   e:"any ใช้กับคำนามพหูพจน์ในประโยคเงื่อนไขหรือคำถาม แปลว่า ถ้ามีคำถามใด ๆ ส่วน much ใช้กับนามนับไม่ได้ และ every, each ตามด้วยนามเอกพจน์"},
  {q:"Two ------- of office furniture are scheduled to arrive this afternoon.", o:["deliver","delivered","delivery","deliveries"], a:3,
   e:"หลัง Two ต้องเป็นคำนามพหูพจน์ และกริยาคือ are จึงตอบ deliveries ส่วน delivery เป็นเอกพจน์"},
  {q:"The new production line will raise the plant's ------- by nearly 30 percent.", o:["output","outlook","outline","outlet"], a:0,
   e:"output แปลว่า ปริมาณการผลิต เข้ากับโรงงานและตัวเลขเปอร์เซ็นต์ ส่วน outlook คือ แนวโน้ม outline คือ โครงร่าง outlet คือ ร้านค้าหรือเต้ารับ"},
  {q:"The updated software allows accountants to process payments more ------- than before.", o:["efficient","efficiency","efficiently","efficiencies"], a:2,
   e:"ช่องว่างขยายกริยา process จึงต้องเป็นกริยาวิเศษณ์ efficiently โครงสร้าง more + adverb + than เป็นการเปรียบเทียบขั้นกว่า"},
  {q:"------- the lease has been signed, the company can start moving into the new office.", o:["Now that","Even though","Rather than","So that"], a:0,
   e:"Now that แปลว่า เนื่องจากตอนนี้… แล้ว ใช้บอกเหตุที่เพิ่งเกิดขึ้น เซ็นสัญญาเช่าแล้วจึงเริ่มย้ายได้ ส่วน Even though แสดงความขัดแย้ง ซึ่งไม่เข้ากับความหมาย"},
  {q:"Customers appreciate the shop's ------- responses to their e-mail inquiries.", o:["distant","prompt","fragile","vacant"], a:1,
   e:"prompt response แปลว่า การตอบกลับที่รวดเร็ว เป็นคู่คำที่พบบ่อย ส่วน distant (ห่างไกล) fragile (แตกง่าย) vacant (ว่าง) ไม่ใช่สิ่งที่ลูกค้าชื่นชม"},
  {q:"The product launch is scheduled ------- March 3 at the Grand Plaza Hotel.", o:["in","at","for","since"], a:2,
   e:"be scheduled for + วันที่ แปลว่า มีกำหนดจัดในวันที่… ต้องจำเป็นชุด แม้ปกติวันที่จะใช้ on ก็ตาม"},
  {q:"The workshop gives participants a chance ------- their presentation skills.", o:["improve","to improve","improved","improves"], a:1,
   e:"คำนาม chance, opportunity, ability มักตามด้วย to + V1 จึงตอบ to improve แปลว่า โอกาสที่จะพัฒนาทักษะการนำเสนอ"},
  {q:"The director gave an ------- speech that motivated the entire sales team.", o:["inspire","inspired","inspiring","inspiration"], a:2,
   e:"ช่องว่างขยายคำนาม speech ซึ่งเป็นสิ่งที่ทำให้คนอื่นรู้สึก จึงใช้รูป -ing คือ inspiring (สร้างแรงบันดาลใจ) ส่วน inspired ใช้กับคนที่ได้รับความรู้สึกนั้น"},
  {q:"A late fee will be ------- to accounts that are not paid within 30 days.", o:["charge","charging","charges","charged"], a:3,
   e:"ค่าปรับเป็นฝ่ายถูกเรียกเก็บ จึงเป็นประโยค passive คือ will be + V3 ตอบ charged"},
  {q:"This week's newsletter ------- an article about the company's new recycling program.", o:["includes","agrees","arrives","belongs"], a:0,
   e:"include แปลว่า มี…รวมอยู่ด้วย และตามด้วยกรรมได้ทันที ส่วน agree, arrive, belong ต้องมีบุพบทก่อนกรรม จึงตัดออกได้จากโครงสร้าง"},
  {q:"The safety ------- introduced last year have reduced workplace accidents.", o:["flavors","measures","rumors","fares"], a:1,
   e:"safety measures แปลว่า มาตรการความปลอดภัย เป็นคำนามประสมที่ออกสอบบ่อย ส่วน flavors (รสชาติ) rumors (ข่าวลือ) fares (ค่าโดยสาร) ไม่เกี่ยวกับการลดอุบัติเหตุ"},
  {q:"Mr. Novak, ------- joined the firm last year, has already been promoted twice.", o:["which","whose","who","what"], a:2,
   e:"คำนามข้างหน้าเป็นคน และช่องว่างเป็นประธานของ joined จึงใช้ who ส่วน which ใช้กับสิ่งของ และ whose ต้องมีคำนามตามหลัง"},
  {q:"Employees are required to wear identification badges ------- they are in the building.", o:["while","during","despite","among"], a:0,
   e:"หลังช่องว่างเป็นประโยค (they are…) จึงต้องใช้คำเชื่อม while ส่วน during, despite, among เป็นบุพบท ต้องตามด้วยคำนาม"},
  {q:"The hotel is ------- located near the airport and the main train station.", o:["convenience","convenient","conveniently","conveniences"], a:2,
   e:"ช่องว่างอยู่ระหว่าง is กับ located จึงใช้กริยาวิเศษณ์ conveniently located แปลว่า ตั้งอยู่ในทำเลที่สะดวก เป็นวลีที่เจอบ่อยในโฆษณาโรงแรม"},
  {q:"All visitors must sign in at the front desk ------- entering the laboratory.", o:["between","from","through","before"], a:3,
   e:"before + V-ing แปลว่า ก่อนที่จะ… ผู้มาติดต่อต้องลงชื่อก่อนเข้าห้องปฏิบัติการ ตัวเลือกอื่นไม่ได้บอกลำดับเวลา"},
  {q:"Ms. Ito asked the interns to finish the survey by -------.", o:["they","their","them","themselves"], a:3,
   e:"by + reflexive pronoun แปลว่า ด้วยตัวเอง ผู้ทำคือ the interns จึงใช้ themselves"}
 ]},
 {id:"p6b", part:"Part 6", items:[
  {p:P6C, q:"ช่องว่างที่ (1)", o:["led","lead","leading","leads"], a:0,
   e:"โครงสร้าง will be + V3 + by เป็น passive แปลว่า จะถูกนำโดย… กริยา lead มี V3 คือ led"},
  {p:P6C, q:"ช่องว่างที่ (2) เลือกประโยคที่เหมาะสมที่สุด", o:["Ms. Ortiz enjoys traveling abroad.","The workshop will run from 9:00 A.M. to 3:00 P.M. in Conference Room B.","Sales increased sharply last quarter.","The cafeteria will be closed in May."], a:1,
   e:"ประกาศแจ้งวันและผู้สอนแล้ว ข้อมูลที่ยังขาดคือเวลาและสถานที่ และประโยคถัดไปพูดถึงอาหารกลางวัน ซึ่งเข้ากับการอบรมที่กินเวลาทั้งวัน"},

/* ---------- สุ่มชุดข้อสอบจากคลัง: เปลี่ยนทุกครั้งที่รีเซ็ตคะแนน ---------- */
var memSeed = 0;
function getSeed(){
  var s = 0;
  try { s = parseInt(localStorage.getItem("toeic-seed"), 10) || 0; } catch(e){}
  if (!s) s = memSeed;
  if (!s) s = newSeed();
  return s;
}
function newSeed(){
  var s = Math.floor(Math.random() * 2147483646) + 1;
  memSeed = s;
  try { localStorage.setItem("toeic-seed", String(s)); } catch(e){}
  return s;
}
function shuffled(arr, rnd){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
var FULLS = {}, GSETS = [], GMIX = null;
function buildSets(){
  var seed = getSeed();
  var rnd = function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function pool(part){ var out = []; SOURCE.forEach(function(s){ if (s.part === part) out = out.concat(s.items); }); return out; }
  /* สลับลำดับตัวเลือก A–D ทุกครั้งที่สุ่ม (ทำสำเนา ไม่แก้คลังเดิม)
     คำอธิบายที่อ้างตัวอักษร เช่น (B) จะถูกแทนด้วยข้อความของตัวเลือกนั้น ข้อที่มีเสียงอ่านตัวเลือกจะเรียงเสียงใหม่ตามลำดับใหม่ */
  function shuffleOpts(it){
    var n = it.o.length, order = shuffled([0,1,2,3].slice(0, n), rnd), c = {};
    for (var k in it) c[k] = it[k];
    c.o = order.map(function(i){ return it.o[i]; });
    c.a = order.indexOf(it.a);
    c.e = String(it.e).replace(/\(([A-D])\)/g, function(m, L){ var i = LETTERS.indexOf(L); return i >= 0 && i < n ? "“" + it.o[i] + "”" : m; });
    var moved = order.some(function(v, i){ return v !== i; });
    if (it.audio && moved){
      var first = -1, voice = "glassy";
      it.audio.forEach(function(l, i){ if (/^[A-D]\.\s/.test(l.t)){ if (first < 0){ first = i; voice = l.v; } } });
      if (first >= 0){
        var rest = it.audio.filter(function(l){ return !/^[A-D]\.\s/.test(l.t); });
        var lines = c.o.map(function(o, i){ return {t:LETTERS[i] + ". " + o, v:voice}; });
        c.audio = rest.slice(0, first).concat(lines, rest.slice(first));
        delete c.clip;
      }
    }
    return c;
  }
  /* แบ่งข้อที่ใช้เนื้อเรื่องหรือบทสนทนาเดียวกันเป็นกลุ่ม แล้วเลือกกลุ่มให้รวมได้จำนวนข้อพอดี */
  function groupsOf(part){
    var groups = [], keys = [];
    pool(part).forEach(function(it){
      var key = it.g || it.p, k = key ? keys.indexOf(key) : -1;
      if (k < 0){ keys.push(key || {}); groups.push([it]); } else groups[k].push(it);
    });

    var groups = groupsOf(part), best = null;
    for (var tries = 0; tries < 300; tries++){

      if (!best || Math.abs(target - sum) < Math.abs(target - best.sum)) best = {picked:picked, sum:sum};

  function draw(part, n){ return shuffled(pool(part), rnd).slice(0, n).map(shuffleOpts); }
  function mk(id, part, desc, items){
    items.forEach(function(it){ it._sid = id; it._part = part; });
    return {id:id, part:part, title:"ชุดฝึก " + part, desc:desc, items:items};
  }
  function bank(part){ return pool(part).length; }
  function stories(part){ return groupsOf(part).length; }
  var sets = [
    mk("l1", "Part 1", "สุ่ม 6 ภาพจากคลัง " + bank("Part 1") + " ภาพ", draw("Part 1", 6)),
    mk("l2", "Part 2", "สุ่ม 25 ข้อจากคลัง " + bank("Part 2") + " ข้อ", draw("Part 2", 25)),
    mk("l3", "Part 3", "สุ่ม 13 บทสนทนาจากคลัง " + stories("Part 3") + " เรื่อง", pickGroups("Part 3", 39)),
    mk("l4", "Part 4", "สุ่ม 10 บทพูดจากคลัง " + stories("Part 4") + " เรื่อง", pickGroups("Part 4", 30)),
    mk("p5", "Part 5", "สุ่ม 30 ข้อจากคลัง " + bank("Part 5") + " ข้อ", draw("Part 5", 30)),
    mk("p6", "Part 6", "สุ่ม 4 เรื่องจากคลัง " + stories("Part 6") + " เรื่อง", pickGroups("Part 6", 16)),
    mk("p7", "Part 7", "สุ่ม 54 ข้อจากคลัง " + bank("Part 7") + " ข้อ (" + stories("Part 7") + " เรื่อง)", pickGroups("Part 7", 54))
  ];
  function full(name, ids, mins){
    var items = [];
    sets.forEach(function(s){ if (ids.indexOf(s.id) >= 0) items = items.concat(s.items); });
    return {id:"full" + name, part:name, title:"สอบ " + name, desc:"รวมทุก Part", items:items, secs:mins * 60, full:true, exam:true};
  }
  FULLS = { Listening: full("Listening", ["l1","l2","l3","l4"], 45), Reading: full("Reading", ["p5","p6","p7"], 75) };
  FULLS.All = {id:"fullAll", part:"Listening + Reading", title:"สอบเสมือนจริง 200 ข้อ", desc:"Listening 100 ข้อ ต่อด้วย Reading 100 ข้อ",
    items:FULLS.Listening.items.concat(FULLS.Reading.items), secs:120 * 60, full:true, exam:true};
  /* แกรมม่า: สลับลำดับข้อและลำดับตัวเลือกทุกครั้งที่รีเซ็ต */
  var gAll = [];
  GSETS = (window.GRAMMAR || []).map(function(t){
    var items = shuffled(t.q, rnd).map(function(r){
      var order = shuffled([0,1,2,3].slice(0, r[1].length), rnd);
      return {q:r[0], o:order.map(function(k){ return r[1][k]; }), a:order.indexOf(r[2]), e:r[3], _sid:"g-" + t.id, _part:"แกรมม่า · " + t.title.split(" (")[0], _topic:t.id};
    });
    gAll = gAll.concat(items);
    return {id:"g-" + t.id, part:"Grammar", title:t.title, desc:t.sub, items:items, grammar:true, topic:t};
  });
  GMIX = {id:"g-mix", part:"Grammar", title:"แบบทดสอบแกรมม่ารวม", desc:"สุ่ม 30 ข้อจากทุกหัวข้อ", items:shuffled(gAll, rnd).slice(0, 30), grammar:true, mix:true};
  return sets;
}

/* เทียบคะแนนดิบเป็นสเกล 5–495 โดยประมาณ (ETS ไม่เปิดเผยตารางจริง และตารางเปลี่ยนทุกชุดสอบ) */
var CURVE = [[0,5],[10,30],[20,60],[30,100],[40,150],[50,205],[60,265],[70,325],[80,375],[90,430],[100,495]];
function scaled(correct, total){
  var x = total ? correct / total * 100 : 0;
  for (var i = 1; i < CURVE.length; i++){
    if (x <= CURVE[i][0]){
      var a = CURVE[i-1], b = CURVE[i];
      var y = a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      return Math.max(5, Math.min(495, Math.round(y / 5) * 5));
    }
  }
  return 495;
}
function sectionScore(sec){

      all += s.items.length;
      var b = getBest(s.id);
      if (b != null){ c += b; n += s.items.length; }
    });
  });
  return {c:c, n:n, all:all, score: n ? scaled(c, n) : null};
}

      var r = attemptScore(sec); if (r.score == null) return;
      sum += r.score; both++;
      cells.push(h("div",{class:"sc"},[ h("div",{class:"muted",text:sec.name}), h("div",{class:"scn"},[ "≈" + r.score, h("small",{text:" /495"}) ]), h("div",{class:"muted",text:"ถูก " + r.c + " จาก " + r.n}) ]));
    });
    if (both === 2) cells.push(h("div",{class:"sc"},[ h("div",{class:"muted",text:"รวม"}), h("div",{class:"scn"},[ "≈" + sum, h("small",{text:" /990"}) ]), h("div",{class:"muted",text:"คะแนนรอบนี้"}) ]));
    kids.push(h("div",{class:"scgrid" + (cells.length === 1 ? " g1" : "")},cells));
  } else if (!s.grammar){
    var sec = secOf(s), r = sec ? sectionScore(sec) : null;
    if (r && r.score != null) kids.push(h("p",{},[ h("strong",{text:"คะแนน " + sec.name + " โดยประมาณ ≈" + r.score + " / 495"}), h("span",{class:"muted",text:" (จาก " + r.n + " ข้อที่ทำแล้ว)"}) ]));
  } else {
    var pct = Math.round(S.correct / n * 100);
    kids.push(h("p",{},[ h("strong",{text:"แม่น " + pct + "% "}), pct >= 80 ? "หัวข้อนี้แน่นแล้ว ไปหัวข้อถัดไปได้" : "ลองอ่านกฎอีกรอบ แล้วทำซ้ำจนได้ 80% ขึ้นไป" ]));
  }
  var unans = exam ? S.unanswered : n - S.correct - S.wrong.length;
  if (S.timeUp) kids.push(h("p",{},[ h("strong",{text:"หมดเวลา "}), "ยังไม่ได้ทำ " + unans + " ข้อ นับเป็นผิด" ]));
  else if (exam && unans) kids.push(h("p",{text:"ไม่ได้ตอบ " + unans + " ข้อ นับเป็นผิด"}));
  kids.push(h("p",{text: S.correct === n ? "ถูกทุกข้อ เยี่ยมมาก" : "ทบทวนข้อที่พลาดด้านล่าง แล้วลองทำซ้ำอีกรอบ"}));
  var missed = S.wrong.slice();
  if (!exam && S.timeUp) for (var k = S.i + (S.picked != null ? 1 : 0); k < n; k++) if (missed.indexOf(k) < 0) missed.push(k);
  if (missed.length) kids.push(h("h3",{text:"เฉลยข้อที่พลาด (" + missed.length + " ข้อ)"}));
  missed.forEach(function(i){
    var it = s.items[i], mine = exam ? S.answers[i] : null;
    kids.push(h("div",{class:"miss"},[
      h("strong",{text:"ข้อ " + (i+1) + (it._part ? " · " + it._part : "")}),
      it.spoken || it.photo ? null : h("span",{text:it.q}),
      h("span",{},[ exam ? (mine == null ? "คุณไม่ได้ตอบ · " : "คุณตอบ (" + LETTERS[mine] + ") · ") : "", h("strong",{text:"ที่ถูกคือ (" + LETTERS[it.a] + ") " + it.o[it.a]}) ]),
      h("span",{class:"muted",text:it.e})
    ]));
  });
  kids.push(h("div",{class:"row"},[
    h("button",{class:"btn",text:"ทำชุดนี้อีกครั้ง",onclick:function(){ if (s.grammar && !s.mix) start(s, false); else openSetup(s); }}),
    s.grammar && !s.mix ? h("button",{class:"btn ghost",text:"อ่านกฎอีกครั้ง",onclick:function(){ S.topic = s; S.view = "lesson"; renderApp(); window.scrollTo(0,0); }}) : null,
    h("button",{class:"btn ghost",text:"กลับหน้าหลัก",onclick:function(){ S.view="home"; renderApp(); window.scrollTo(0,0); }})
  ]));
  app.appendChild(h("section",{class:"card"},kids));
}

/* ---------- เปิด-ปิดเว็บ: อ่านจากไฟล์ config.json ---------- */
S.tts = !!synth;
try {
  fetch("audio/manifest.json", {cache:"no-cache"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(m){
    if (m && typeof m === "object"){ MANIFEST = m; S.tts = true; if (S.view === "quiz") renderApp(); }
  }, function(){});
} catch(e){}
if (synth){ try { synth.getVoices(); synth.onvoiceschanged = function(){}; } catch(e){} }
(function init(){
  function apply(c){
    S.access = c && c.open === false ? "closed" : "open";
    S.message = c && typeof c.message === "string" ? c.message : "";
    render();
  }
  var done = false, timer = setTimeout(function(){ if (!done){ done = true; apply(null); } }, 6000);
  try {
    fetch("config.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(c){
      if (done) return; done = true; clearTimeout(timer); apply(c);
    }, function(){ if (done) return; done = true; clearTimeout(timer); apply(null); });
  } catch(e){ done = true; clearTimeout(timer); apply(null); }
})();
render();
</script>
</body>
</html>
