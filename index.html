<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ติว TOEIC ฟรี</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one narrow column like an answer sheet; oval letter bubbles are the motif. */
:root{
  --paper:#f2f5f7; --card:#ffffff; --ink:#14273b; --muted:#5b6b7c; --line:#d5dde4;
  --accent:#0f5f86; --accent-ink:#ffffff; --mark:#f2b830;
  --good:#1c7a4c; --good-bg:#e3f4ea; --bad:#b3372f; --bad-bg:#fbe7e4;
  --display:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,sans-serif;
  --body:"IBM Plex Sans","IBM Plex Sans Thai",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#0f1822; --card:#182431; --ink:#e6edf3; --muted:#9aaaba; --line:#2c3b4b;
    --accent:#5fb4dc; --accent-ink:#08202e; --mark:#f2b830;
    --good:#6fd39c; --good-bg:#153526; --bad:#f08d84; --bad-bg:#3d1c1a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#0f1822; --card:#182431; --ink:#e6edf3; --muted:#9aaaba; --line:#2c3b4b;
  --accent:#5fb4dc; --accent-ink:#08202e; --mark:#f2b830;
  --good:#6fd39c; --good-bg:#153526; --bad:#f08d84; --bad-bg:#3d1c1a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:18px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--mono);font-weight:600;background:var(--ink);color:var(--paper);border-radius:999px;padding:2px 12px;font-size:14px;letter-spacing:.04em}
h1{font-family:var(--display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
h2{font-family:var(--display);font-size:18px;margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.admin{border-left:5px solid var(--mark)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 12px;border:1px solid currentColor}
.pill.on{color:var(--good);background:var(--good-bg)}
.pill.off{color:var(--bad);background:var(--bad-bg)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-family:var(--display)}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:var(--bad);color:var(--card)}
.btn:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
input[type=text]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:1;min-width:0}
.sets{display:flex;flex-direction:column;gap:10px}
.set{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;width:100%}
.set:hover{border-color:var(--accent)}
.set .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:4px 10px;white-space:nowrap}
.set .t{font-family:var(--display);font-weight:600;line-height:1.35}
.set .d{color:var(--muted);font-size:14px}
.set .grow{flex:1;min-width:0}
.set .best{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sec{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:6px}
.sechead h2{font-size:21px}
.parthead{display:flex;gap:12px;align-items:center;margin-top:6px}
.parthead .num{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:4px 10px;white-space:nowrap}
.parthead .t{font-family:var(--display);font-weight:600;line-height:1.35}
.parthead .d{color:var(--muted);font-size:14px}
.parthead .grow{flex:1;min-width:0}
.pill.soon{color:var(--muted);white-space:nowrap}
.scgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sc{border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.sc .muted{font-size:13px;line-height:1.4}
.scn{font-family:var(--mono);font-weight:600;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.4}
.scn small{font-size:12px;color:var(--muted);font-weight:500}
@media (max-width:420px){.scgrid{grid-template-columns:1fr}}
.pill.timer{font-family:var(--mono);color:var(--accent);font-variant-numeric:tabular-nums;margin-left:auto}
.set.fullset{border-color:var(--accent);border-width:2px}
.bar{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.passage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;white-space:pre-wrap;font-size:15px;line-height:1.6}
.fig{border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:8px;color:var(--ink)}
.fig img{display:block;width:100%;max-width:440px;height:auto;margin:0 auto;border-radius:6px}
.fig svg{display:block;width:100%;height:auto;max-height:240px}
.q{font-size:17px;font-weight:500;line-height:1.55}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.opt .b{font-family:var(--mono);font-weight:600;font-size:13px;border:1.5px solid var(--ink);border-radius:999px;width:34px;height:24px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.opt:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .b{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .b{background:var(--bad);border-color:var(--bad);color:var(--card)}
.exp{border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;gap:6px}
.exp .v{font-family:var(--display);font-weight:700}
.exp .v.ok{color:var(--good)} .exp .v.no{color:var(--bad)}
.score{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.miss{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px;font-size:15px}
.center{text-align:center;align-items:center;padding:36px 16px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo">A B C D</span>
    <h1>ติว TOEIC ฟรี</h1>
  </header>
  <div id="admin"></div>
  <main id="app"><div class="card center"><p>กำลังตรวจสอบสถานะเว็บ…</p></div></main>

   e:"ช่องว่างอยู่ระหว่าง is กับ being renovated ต้องใช้กริยาวิเศษณ์มาขยายกริยา จึงตอบ currently (ขณะนี้) ส่วน currency แปลว่า สกุลเงิน"},
  {q:"Sales of the new model were ------- higher than the company had expected.", o:["significant","significance","significantly","signify"], a:2,
   e:"คำที่ขยายคำคุณศัพท์ higher ต้องเป็นกริยาวิเศษณ์ จึงตอบ significantly แปลว่า ยอดขายสูงกว่าที่คาดไว้อย่างมีนัยสำคัญ"},
  {q:"The new software is much ------- to use than the previous version.", o:["easy","easier","easiest","easily"], a:1,
   e:"เห็น than ให้นึกถึงการเปรียบเทียบขั้นกว่า และ much ใช้ขยายขั้นกว่าได้ จึงตอบ easier"},
  {q:"Please ------- the attached document before the meeting.", o:["review","reviewing","reviewed","to review"], a:0,
   e:"ประโยคคำสั่งหรือขอร้องขึ้นต้นด้วย Please ตามด้วยกริยาช่องที่ 1 จึงตอบ review แปลว่า กรุณาตรวจทานเอกสารแนบก่อนประชุม"},
  {q:"Applicants ------- have at least three years of experience will be given priority.", o:["which","whose","who","whom"], a:2,
   e:"คำนามข้างหน้าเป็นคน (Applicants) และช่องว่างทำหน้าที่ประธานของ have จึงใช้ who ส่วน whom ใช้เป็นกรรม และ whose ต้องมีคำนามตามหลัง"},
  {q:"The manager asked that the report ------- completed by the end of the week.", o:["is","be","was","being"], a:1,
   e:"หลังกริยาแสดงการขอหรือสั่ง เช่น ask, request, suggest + that ให้ใช้กริยาช่องที่ 1 ไม่ผัน (subjunctive) จึงตอบ be"},
  {q:"By the time the director arrives, the staff ------- the presentation materials.", o:["prepare","prepared","will have prepared","had prepared"], a:2,
   e:"By the time + Present Simple บอกเวลาในอนาคต ประโยคหลักจึงใช้ Future Perfect (will have + V3) หมายถึงจะเตรียมเสร็จก่อนผู้อำนวยการมาถึง"}
 ]},
 {id:"p5b", part:"Part 5", title:"เติมประโยคให้สมบูรณ์ ชุดที่ 2", desc:"บุพบท คำเชื่อม และคำศัพท์", items:[
  {q:"Ms. Tanaka is responsible ------- training all new employees.", o:["to","for","with","at"], a:1,
   e:"สำนวน be responsible for + V-ing แปลว่า รับผิดชอบเรื่อง… เป็นคู่คำที่ออกสอบบ่อย ต้องจำทั้งชุด"},
  {q:"------- the heavy rain, the outdoor event was held as scheduled.", o:["Although","Despite","Because","Unless"], a:1,
   e:"หลังช่องว่างเป็นคำนามวลี (the heavy rain) ไม่ใช่ประโยค จึงใช้บุพบท Despite ส่วน Although ต้องตามด้วยประโยคที่มีประธานและกริยา"},
  {q:"Customers who order before noon will receive their items ------- two business days.", o:["within","among","since","until"], a:0,
   e:"within + ระยะเวลา แปลว่า ภายใน… จึงได้ความว่า จะได้รับสินค้าภายในสองวันทำการ"},
  {q:"Mr. Lee has worked at the company ------- 2015.", o:["for","during","since","from"], a:2,
   e:"Present Perfect (has worked) + จุดเริ่มต้นของเวลา ใช้ since ส่วน for ใช้กับระยะเวลา เช่น for ten years"},
  {q:"Neither the supervisor ------- the technicians were aware of the schedule change.", o:["or","and","nor","but"], a:2,
   e:"neither … nor … เป็นคำเชื่อมคู่ แปลว่า ไม่ทั้ง…และ… ส่วน or ใช้คู่กับ either"},
  {q:"The company's profits increased ------- 15 percent last quarter.", o:["by","at","on","to"], a:0,
   e:"increase by + จำนวน บอกปริมาณที่เพิ่มขึ้น แปลว่า กำไรเพิ่มขึ้น 15 เปอร์เซ็นต์ ส่วน increase to บอกระดับที่ไปถึง"},
  {q:"The shipment was delayed ------- a problem at the customs office.", o:["because","due to","so that","in order"], a:1,
   e:"หลังช่องว่างเป็นคำนามวลี จึงใช้ due to (เนื่องจาก) ส่วน because ต้องตามด้วยประโยค ถ้าจะใช้กับคำนามต้องเป็น because of"},
  {q:"Ms. Park will be promoted ------- regional manager next month.", o:["as","to","for","into"], a:1,
   e:"be promoted to + ตำแหน่ง แปลว่า ได้เลื่อนตำแหน่งเป็น… เป็นคู่คำที่พบบ่อยในบริบทงานบุคคล"},
  {q:"The factory is equipped with machines ------- of producing 500 units per hour.", o:["capable","able","possible","skilled"], a:0,
   e:"capable of + V-ing แปลว่า สามารถ… ส่วน able ต้องใช้กับ to + V1 จึงดูจากบุพบท of ที่ตามหลังช่องว่าง"}
 ]},
 {id:"p6", part:"Part 6", title:"เติมข้อความในเนื้อเรื่อง", desc:"ประกาศและจดหมายธุรกิจ 2 เรื่อง", items:[
  {p:P6A, q:"ช่องว่างที่ (1)", o:["take","spend","pass","keep"], a:0,
   e:"งานหรือกิจกรรม + take + ระยะเวลา แปลว่า ใช้เวลา… ส่วน spend ต้องมีคนเป็นประธาน เช่น We spent six hours"},
  {p:P6A, q:"ช่องว่างที่ (2) เลือกประโยคที่เหมาะสมที่สุด", o:["The elevator was installed ten years ago.","Building A has the largest cafeteria on campus.","The service elevator can carry up to ten people at a time.","Employees should submit their timesheets on Friday."], a:2,
   e:"ประโยคก่อนหน้าแนะนำให้ใช้ลิฟต์ขนของ ประโยคที่ต่อเนื่องที่สุดจึงเป็นข้อมูลเพิ่มเติมของลิฟต์ตัวนั้น คือบรรทุกได้ครั้งละไม่เกินสิบคน ตัวเลือกอื่นไม่เกี่ยวกับเรื่องที่กำลังพูดถึง"},
  {p:P6A, q:"ช่องว่างที่ (3)", o:["convenient","inconvenient","conveniently","inconvenience"], a:3,
   e:"หลัง any ต้องเป็นคำนาม และสำนวน We apologize for any inconvenience แปลว่า ขออภัยในความไม่สะดวก พบบ่อยมากในประกาศ"},
  {p:P6B, q:"ช่องว่างที่ (1)", o:["temporary","temporarily","temporariness","temporaries"], a:1,
   e:"ช่องว่างอยู่หลัง is และขยาย out of stock จึงใช้กริยาวิเศษณ์ temporarily แปลว่า สินค้าหมดชั่วคราว"},
  {p:P6B, q:"ช่องว่างที่ (2)", o:["Alternatively","Therefore","For example","Similarly"], a:0,
   e:"ประโยคก่อนหน้าบอกว่าให้รอสินค้าล็อตใหม่ ประโยคนี้เสนอทางเลือกอื่น คือเปลี่ยนรุ่นหรือขอเงินคืน จึงใช้ Alternatively (อีกทางเลือกหนึ่ง)"},
  {p:P6B, q:"ช่องว่างที่ (3)", o:["prefers","preferring","prefer","to prefer"], a:2,
   e:"ประธานคือ you และเป็นข้อเท็จจริงปัจจุบัน จึงใช้กริยาช่องที่ 1 ไม่เติม s คือ prefer แปลว่า ตัวเลือกที่คุณต้องการ"}
 ]},
 {id:"p7", part:"Part 7", title:"อ่านจับใจความ", desc:"ประกาศและอีเมล 2 เรื่อง", items:[
  {p:P7A, q:"What is the purpose of the notice?", o:["To announce changes to library services","To ask members for donations","To introduce a new librarian","To explain membership fees"], a:0,
   e:"ประกาศแจ้งเรื่องขยายเวลาเปิดทำการและระบบจองห้องออนไลน์ ซึ่งเป็นการเปลี่ยนแปลงบริการของห้องสมุด ไม่มีการพูดถึงเงินบริจาค บรรณารักษ์ใหม่ หรือค่าสมาชิก"},
  {p:P7A, q:"What is indicated about weekend hours?", o:["They will be extended.","They will be shortened.","The library will close on weekends.","They will stay the same."], a:3,
   e:"ในเนื้อเรื่องเขียนว่า Weekend hours … will remain unchanged ซึ่ง remain unchanged มีความหมายเดียวกับ stay the same ข้อสอบมักเปลี่ยนคำแบบนี้ (paraphrase)"},
  {p:P7A, q:"How long can a study room be reserved at one time?", o:["One hour","Two hours","Seven hours","Seven days"], a:1,
   e:"คำตอบอยู่ที่ Each reservation is limited to two hours ส่วน seven days คือจำนวนวันที่จองล่วงหน้าได้ เป็นตัวลวงที่ต้องระวัง"},
  {p:P7B, q:"Why was the client visit changed?", o:["The factory will be closed on Wednesday.","Emily is not available on Wednesday.","The clients' flight was rescheduled.","The restaurant was fully booked."], a:2,
   e:"ย่อหน้าแรกบอกเหตุผลตรง ๆ ว่า because their flight was rescheduled คือเที่ยวบินของลูกค้าถูกเลื่อน"},
  {p:P7B, q:"What is Emily asked to do about lunch?", o:["Order food to be delivered to the office","Reserve a table at a restaurant with vegetarian dishes","Cancel the lunch meeting","Invite more staff members"], a:1,
   e:"Daniel ขอให้ book a table for six และให้แน่ใจว่าร้านมีอาหารสำหรับคนกินมังสวิรัติ book กับ reserve มีความหมายเหมือนกัน"},
  {p:P7B, q:"When should Emily send the updated schedule?", o:["On Monday morning","On Wednesday","On Thursday at 10:00 A.M.","By Tuesday afternoon"], a:3,
   e:"ย่อหน้าสุดท้ายเขียนว่า send me the updated schedule by Tuesday afternoon ส่วน Thursday 10:00 A.M. คือเวลาพาชมโรงงาน ไม่ใช่กำหนดส่งตาราง"}
 ]},
 {id:"p5c", part:"Part 5", items:[
  {q:"Guests attending the annual awards dinner will be offered free ------- from the hotel to the convention center.", o:["transported","transports","transporting","transportation"], a:3,
   e:"หลังคำคุณศัพท์ free ต้องเป็นคำนาม จึงตอบ transportation (การเดินทาง รถรับส่ง) ท้ายคำ -tion เป็นสัญญาณของคำนาม"},
  {q:"Ms. Alvarez submitted a proposal that ------- the benefits of switching to solar energy.", o:["outlined","attended","hired","rented"], a:0,
   e:"ข้อนี้วัดคำศัพท์ outline แปลว่า สรุปประเด็นสำคัญ เข้ากับ proposal และ benefits ส่วน attend (เข้าร่วม) hire (จ้าง) rent (เช่า) ใช้กับ benefits ไม่ได้"},
  {q:"The updated manual is available only to ------- technicians.", o:["certify","certified","certification","certifying"], a:1,
   e:"ช่องว่างอยู่หน้าคำนาม technicians ต้องใช้คำคุณศัพท์ ช่างเป็นฝ่ายถูกรับรอง จึงใช้รูป V3 คือ certified แปลว่า ช่างที่ได้รับการรับรอง"},
  {q:"Several residents raised ------- about the noise from the construction site.", o:["receipts","rewards","concerns","shortcuts"], a:2,
   e:"raise concerns about เป็นคู่คำ แปลว่า แสดงความกังวลเรื่อง… ตัวเลือกอื่นคือ ใบเสร็จ รางวัล ทางลัด ไม่เข้ากับเรื่องเสียงดังจากไซต์ก่อสร้าง"},
  {q:"The city council ------- a new parking policy at next Tuesday's meeting.", o:["discussed","discussing","will discuss","to discuss"], a:2,
   e:"next Tuesday บอกเวลาในอนาคต จึงใช้ will + V1 ส่วน discussing และ to discuss ทำหน้าที่กริยาหลักของประโยคไม่ได้"},
  {q:"If you have ------- questions about your invoice, please contact our billing office.", o:["much","any","every","each"], a:1,
   e:"any ใช้กับคำนามพหูพจน์ในประโยคเงื่อนไขหรือคำถาม แปลว่า ถ้ามีคำถามใด ๆ ส่วน much ใช้กับนามนับไม่ได้ และ every, each ตามด้วยนามเอกพจน์"},
  {q:"Two ------- of office furniture are scheduled to arrive this afternoon.", o:["deliver","delivered","delivery","deliveries"], a:3,
   e:"หลัง Two ต้องเป็นคำนามพหูพจน์ และกริยาคือ are จึงตอบ deliveries ส่วน delivery เป็นเอกพจน์"},
  {q:"The new production line will raise the plant's ------- by nearly 30 percent.", o:["output","outlook","outline","outlet"], a:0,
   e:"output แปลว่า ปริมาณการผลิต เข้ากับโรงงานและตัวเลขเปอร์เซ็นต์ ส่วน outlook คือ แนวโน้ม outline คือ โครงร่าง outlet คือ ร้านค้าหรือเต้ารับ"},
  {q:"The updated software allows accountants to process payments more ------- than before.", o:["efficient","efficiency","efficiently","efficiencies"], a:2,
   e:"ช่องว่างขยายกริยา process จึงต้องเป็นกริยาวิเศษณ์ efficiently โครงสร้าง more + adverb + than เป็นการเปรียบเทียบขั้นกว่า"},
  {q:"------- the lease has been signed, the company can start moving into the new office.", o:["Now that","Even though","Rather than","So that"], a:0,
   e:"Now that แปลว่า เนื่องจากตอนนี้… แล้ว ใช้บอกเหตุที่เพิ่งเกิดขึ้น เซ็นสัญญาเช่าแล้วจึงเริ่มย้ายได้ ส่วน Even though แสดงความขัดแย้ง ซึ่งไม่เข้ากับความหมาย"},
  {q:"Customers appreciate the shop's ------- responses to their e-mail inquiries.", o:["distant","prompt","fragile","vacant"], a:1,
   e:"prompt response แปลว่า การตอบกลับที่รวดเร็ว เป็นคู่คำที่พบบ่อย ส่วน distant (ห่างไกล) fragile (แตกง่าย) vacant (ว่าง) ไม่ใช่สิ่งที่ลูกค้าชื่นชม"},
  {q:"The product launch is scheduled ------- March 3 at the Grand Plaza Hotel.", o:["in","at","for","since"], a:2,
   e:"be scheduled for + วันที่ แปลว่า มีกำหนดจัดในวันที่… ต้องจำเป็นชุด แม้ปกติวันที่จะใช้ on ก็ตาม"},
  {q:"The workshop gives participants a chance ------- their presentation skills.", o:["improve","to improve","improved","improves"], a:1,
   e:"คำนาม chance, opportunity, ability มักตามด้วย to + V1 จึงตอบ to improve แปลว่า โอกาสที่จะพัฒนาทักษะการนำเสนอ"},
  {q:"The director gave an ------- speech that motivated the entire sales team.", o:["inspire","inspired","inspiring","inspiration"], a:2,
   e:"ช่องว่างขยายคำนาม speech ซึ่งเป็นสิ่งที่ทำให้คนอื่นรู้สึก จึงใช้รูป -ing คือ inspiring (สร้างแรงบันดาลใจ) ส่วน inspired ใช้กับคนที่ได้รับความรู้สึกนั้น"},
  {q:"A late fee will be ------- to accounts that are not paid within 30 days.", o:["charge","charging","charges","charged"], a:3,
   e:"ค่าปรับเป็นฝ่ายถูกเรียกเก็บ จึงเป็นประโยค passive คือ will be + V3 ตอบ charged"},
  {q:"This week's newsletter ------- an article about the company's new recycling program.", o:["includes","agrees","arrives","belongs"], a:0,
   e:"include แปลว่า มี…รวมอยู่ด้วย และตามด้วยกรรมได้ทันที ส่วน agree, arrive, belong ต้องมีบุพบทก่อนกรรม จึงตัดออกได้จากโครงสร้าง"},
  {q:"The safety ------- introduced last year have reduced workplace accidents.", o:["flavors","measures","rumors","fares"], a:1,
   e:"safety measures แปลว่า มาตรการความปลอดภัย เป็นคำนามประสมที่ออกสอบบ่อย ส่วน flavors (รสชาติ) rumors (ข่าวลือ) fares (ค่าโดยสาร) ไม่เกี่ยวกับการลดอุบัติเหตุ"},
  {q:"Mr. Novak, ------- joined the firm last year, has already been promoted twice.", o:["which","whose","who","what"], a:2,
   e:"คำนามข้างหน้าเป็นคน และช่องว่างเป็นประธานของ joined จึงใช้ who ส่วน which ใช้กับสิ่งของ และ whose ต้องมีคำนามตามหลัง"},
  {q:"Employees are required to wear identification badges ------- they are in the building.", o:["while","during","despite","among"], a:0,
   e:"หลังช่องว่างเป็นประโยค (they are…) จึงต้องใช้คำเชื่อม while ส่วน during, despite, among เป็นบุพบท ต้องตามด้วยคำนาม"},
  {q:"The hotel is ------- located near the airport and the main train station.", o:["convenience","convenient","conveniently","conveniences"], a:2,
   e:"ช่องว่างอยู่ระหว่าง is กับ located จึงใช้กริยาวิเศษณ์ conveniently located แปลว่า ตั้งอยู่ในทำเลที่สะดวก เป็นวลีที่เจอบ่อยในโฆษณาโรงแรม"},
  {q:"All visitors must sign in at the front desk ------- entering the laboratory.", o:["between","from","through","before"], a:3,
   e:"before + V-ing แปลว่า ก่อนที่จะ… ผู้มาติดต่อต้องลงชื่อก่อนเข้าห้องปฏิบัติการ ตัวเลือกอื่นไม่ได้บอกลำดับเวลา"},
  {q:"Ms. Ito asked the interns to finish the survey by -------.", o:["they","their","them","themselves"], a:3,
   e:"by + reflexive pronoun แปลว่า ด้วยตัวเอง ผู้ทำคือ the interns จึงใช้ themselves"}
 ]},
 {id:"p6b", part:"Part 6", items:[
  {p:P6C, q:"ช่องว่างที่ (1)", o:["led","lead","leading","leads"], a:0,
   e:"โครงสร้าง will be + V3 + by เป็น passive แปลว่า จะถูกนำโดย… กริยา lead มี V3 คือ led"},
  {p:P6C, q:"ช่องว่างที่ (2) เลือกประโยคที่เหมาะสมที่สุด", o:["Ms. Ortiz enjoys traveling abroad.","The workshop will run from 9:00 A.M. to 3:00 P.M. in Conference Room B.","Sales increased sharply last quarter.","The cafeteria will be closed in May."], a:1,

/* ---------- สุ่มชุดข้อสอบจากคลัง: เปลี่ยนทุกครั้งที่รีเซ็ตคะแนน ---------- */
var memSeed = 0;
function getSeed(){
  var s = 0;
  try { s = parseInt(localStorage.getItem("toeic-seed"), 10) || 0; } catch(e){}
  if (!s) s = memSeed;
  if (!s) s = newSeed();
  return s;
}
function newSeed(){
  var s = Math.floor(Math.random() * 2147483646) + 1;
  memSeed = s;
  try { localStorage.setItem("toeic-seed", String(s)); } catch(e){}
  return s;
}
function shuffled(arr, rnd){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(rnd() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
var FULLS = {};
function buildSets(){
  var seed = getSeed();
  var rnd = function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  function pool(part){ var out = []; SOURCE.forEach(function(s){ if (s.part === part) out = out.concat(s.items); }); return out; }
  function grouped(part){
    var groups = [], keys = [];
    pool(part).forEach(function(it){
      var key = it.g || it.p, k = key ? keys.indexOf(key) : -1;
      if (k < 0){ keys.push(key || {}); groups.push([it]); } else groups[k].push(it);
    });
    var out = [];
    shuffled(groups, rnd).forEach(function(g){ out = out.concat(g); });
    return out;
  }
  function mk(id, part, desc, items){
    items.forEach(function(it){ it._sid = id; it._part = part; });
    return {id:id, part:part, title:"ชุดฝึก " + part, desc:desc, items:items};
  }
  var n5 = pool("Part 5").length;
  var sets = [
    mk("l1", "Part 1", "ดูภาพแล้วฟัง 4 ประโยค", shuffled(pool("Part 1"), rnd)),
    mk("l2", "Part 2", "ฟังคำถามและ 3 คำตอบ", shuffled(pool("Part 2"), rnd)),
    mk("l3", "Part 3", "ฟังบทสนทนา ตอบเรื่องละ 3 ข้อ", grouped("Part 3")),
    mk("l4", "Part 4", "ฟังประกาศหรือข้อความ ตอบเรื่องละ 3 ข้อ", grouped("Part 4")),
    mk("p5", "Part 5", "สุ่ม 30 ข้อจากคลัง " + n5 + " ข้อ", shuffled(pool("Part 5"), rnd).slice(0, 30)),
    mk("p6", "Part 6", "4 เรื่อง เรื่องละ 4 ข้อ", grouped("Part 6")),
    mk("p7", "Part 7", "ประกาศ อีเมล บทความ และเนื้อเรื่องคู่", grouped("Part 7"))
  ];
  function full(name, ids, mins){
    var items = [];
    sets.forEach(function(s){ if (ids.indexOf(s.id) >= 0) items = items.concat(s.items); });
    return {id:"full" + name, part:name, title:"สอบเต็มชุด " + name, desc:"รวมทุก Part", items:items, secs:mins * 60, full:true};
  }
  FULLS = { Listening: full("Listening", ["l1","l2","l3","l4"], 45), Reading: full("Reading", ["p5","p6","p7"], 75) };
  return sets;
}
var SETS = buildSets();

function h(tag, attrs, kids){
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs){
    if (k === "class") el.className = attrs[k];
    else if (k === "text") el.textContent = attrs[k];
    else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function(c){ if (c) el.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
  return el;
}

function setBest(id, n){ try { var b = JSON.parse(localStorage.getItem("toeic-best2") || "{}"); if (!(b[id] >= n)) { b[id] = n; localStorage.setItem("toeic-best2", JSON.stringify(b)); } } catch(e){} }

    kids.push(h("p",{class:"muted", text: open ? "ผู้ที่คุณแชร์ลิงก์ให้เข้าทำข้อสอบได้ตอนนี้" : "ผู้ใช้จะเห็นหน้าแจ้งว่าเว็บปิด มีแค่คุณที่ยังเห็นข้อสอบ"}));
    kids.push(h("div",{class:"row"},[input]));
    kids.push(h("div",{class:"row"},[
      h("button",{class:"btn", disabled:S.saving, text: open ? "ปิดเว็บ" : "เปิดเว็บ", onclick:function(){ saveConfig(!open, input.value); }}),
      h("button",{class:"btn ghost", disabled:S.saving, text:"บันทึกข้อความ", onclick:function(){ saveConfig(open, input.value); }})
    ]));
    if (S.adminErr) kids.push(h("p",{class:"muted", text:S.adminErr}));
  }
  adminEl.appendChild(h("section",{class:"card admin"},kids));
}

function saveConfig(open, msg){
  if (!configRef || S.saving) return;
  S.saving = true; S.adminErr = ""; renderAdmin();
  configRef.set({open:open, message:String(msg || "").slice(0,200)}).then(function(){
    S.saving = false; renderAdmin();
  }, function(){
    S.saving = false; S.adminErr = "บันทึกไม่สำเร็จ ลองกดอีกครั้ง"; renderAdmin();
  });
}

function renderApp(){
  app.textContent = "";
  if (!S.isOwner && S.access !== "open"){
    var t = S.access === "loading" ? "กำลังตรวจสอบสถานะเว็บ…"
          : S.access === "closed" ? "เว็บปิดให้บริการชั่วคราว"
          : "ตรวจสอบสถานะเว็บไม่ได้";
    var d = S.access === "closed" ? (S.message || "ผู้ดูแลยังไม่เปิดให้เข้าใช้งาน กลับมาใหม่ภายหลัง")
          : S.access === "unknown" ? "ลองโหลดหน้านี้ใหม่อีกครั้ง" : "";
    app.appendChild(h("div",{class:"card center"},[ h("h2",{text:t}), d ? h("p",{class:"muted",text:d}) : null ]));
    return;
  }
  if (S.view === "home") return renderHome();
  if (S.view === "setup") return renderSetup();
  if (S.view === "quiz") return renderQuiz();
  renderResult();
}

var SECTIONS = [
 {name:"Listening", sub:"การฟัง · สอบจริง 100 ข้อ 45 นาที", parts:[
  {part:"Part 1", name:"บรรยายภาพ (Photographs)", n:6},
  {part:"Part 2", name:"ถาม-ตอบ (Question-Response)", n:25},
  {part:"Part 3", name:"บทสนทนา (Conversations)", n:39},
  {part:"Part 4", name:"บทพูดคนเดียว (Talks)", n:30}
 ]},
 {name:"Reading", sub:"การอ่าน · สอบจริง 100 ข้อ 75 นาที", parts:[
  {part:"Part 5", name:"เติมประโยคให้สมบูรณ์ (Incomplete Sentences)", n:30},
  {part:"Part 6", name:"เติมข้อความในเนื้อเรื่อง (Text Completion)", n:16},
  {part:"Part 7", name:"อ่านจับใจความ (Reading Comprehension)", n:54}
 ]}
];

/* เทียบคะแนนดิบเป็นสเกล 5–495 โดยประมาณ (ETS ไม่เปิดเผยตารางจริง และตารางเปลี่ยนทุกชุดสอบ) */
var CURVE = [[0,5],[10,30],[20,60],[30,100],[40,150],[50,205],[60,265],[70,325],[80,375],[90,430],[100,495]];
function scaled(correct, total){
  var x = total ? correct / total * 100 : 0;
  for (var i = 1; i < CURVE.length; i++){
    if (x <= CURVE[i][0]){
      var a = CURVE[i-1], b = CURVE[i];
      var y = a[1] + (b[1] - a[1]) * (x - a[0]) / (b[0] - a[0]);
      return Math.max(5, Math.min(495, Math.round(y / 5) * 5));
    }
  }
  return 495;
}
function sectionScore(sec){
  var c = 0, n = 0, all = 0;
  sec.parts.forEach(function(p){
    SETS.forEach(function(s){
      if (s.part !== p.part) return;
      all += s.items.length;
      var b = getBest(s.id);
      if (b != null){ c += b; n += s.items.length; }
    });
  });
  return {c:c, n:n, all:all, score: n ? scaled(c, n) : null};
}
function scoreCard(){
  var cells = SECTIONS.map(function(sec){
    var r = sectionScore(sec);
    return h("div",{class:"sc"},[
      h("div",{class:"muted",text:sec.name}),
      h("div",{class:"scn"},[ r.score == null ? "–" : "≈" + r.score, h("small",{text:" /495"}) ]),
      h("div",{class:"muted",text: !r.all ? "ยังไม่เปิด" : !r.n ? "ยังไม่ได้ทำ" : "ถูก " + r.c + " จาก " + r.n + " ข้อที่ทำแล้ว"})
    ]);
  });
  var rs = SECTIONS.map(sectionScore);
  var full = rs.every(function(r){ return r.score != null; });
  cells.push(h("div",{class:"sc"},[
    h("div",{class:"muted",text:"รวม"}),
    h("div",{class:"scn"},[ full ? "≈" + (rs[0].score + rs[1].score) : "–", h("small",{text:" /990"}) ]),
    h("div",{class:"muted",text: full ? "Listening + Reading" : "ต้องมีคะแนนครบทั้งสองส่วน"})
  ]));
  return h("section",{class:"card"},[
    h("h2",{text:"คะแนนของคุณ"}),
    h("div",{class:"scgrid"},cells),
    h("p",{class:"muted",text:"คิดแบบสอบจริง ส่วนละ 5–495 รวมเต็ม 990 ตอบผิดไม่ติดลบ ตัวเลขเป็นค่าประมาณจากคะแนนดีที่สุดของแต่ละชุด"}),
    S.confirmReset
      ? h("div",{class:"row"},[
          h("span",{text:"ลบคะแนนทั้งหมดและสุ่มข้อสอบชุดใหม่?"}),
          h("button",{class:"btn danger",text:"ลบคะแนน",onclick:function(){ try { localStorage.removeItem("toeic-best2"); } catch(e){} newSeed(); SETS = buildSets(); S.confirmReset = false; renderApp(); }}),
          h("button",{class:"btn ghost",text:"ยกเลิก",onclick:function(){ S.confirmReset = false; renderApp(); }})
        ])
      : h("div",{class:"row"},[
          h("button",{class:"btn ghost",text:"รีเซ็ตคะแนน และสุ่มข้อสอบใหม่",onclick:function(){ S.confirmReset = true; renderApp(); }})
        ])
  ]);
}

function renderHome(){
  var kids = [ scoreCard(), h("p",{text:"เลือกชุดข้อสอบ ตอบทีละข้อ แล้วอ่านคำอธิบายภาษาไทยทันทีหลังตอบ"}) ];
  SECTIONS.forEach(function(sec){
    var body = [ h("div",{class:"sechead"},[ h("h2",{text:sec.name}), h("span",{class:"muted",text:sec.sub}) ]) ];
    var fs = FULLS[sec.name];
    if (fs && fs.items.length) body.push(h("button",{class:"set fullset", onclick:function(){ openSetup(fs); }},[
      h("span",{class:"grow"},[ h("div",{class:"t",text:fs.title}), h("div",{class:"d",text:fs.items.length + " ข้อ · " + Math.round(fs.secs / 60) + " นาที เหมือนสอบจริง"}) ]),
      h("span",{class:"best",text:"เริ่มสอบ →"})
    ]));
    sec.parts.forEach(function(p){
      var sets = SETS.filter(function(s){ return s.part === p.part; });
      body.push(h("div",{class:"parthead"},[
        h("span",{class:"num",text:p.part}),
        h("span",{class:"grow"},[ h("div",{class:"t",text:p.name}), h("div",{class:"d",text:"สอบจริง " + p.n + " ข้อ"}) ]),
        sets.length ? null : h("span",{class:"pill soon",text:"ยังไม่เปิด"})
      ]));
      sets.forEach(function(s){
        var best = getBest(s.id);
        body.push(h("button",{class:"set", onclick:function(){ openSetup(s); }},[
          h("span",{class:"grow"},[ h("div",{class:"t",text:s.title}), h("div",{class:"d",text:s.desc + " · " + s.items.length + " ข้อ"}) ]),
          h("span",{class:"best",text: best == null ? "เริ่มทำ →" : "ดีสุด " + best + "/" + s.items.length})
        ]));
      });
    });
    kids.push(h("section",{class:"sec"},body));
  });
  app.appendChild(h("div",{class:"sets"},kids));
}

var synth = (typeof window.speechSynthesis !== "undefined" && typeof window.SpeechSynthesisUtterance !== "undefined") ? window.speechSynthesis : null;
var VOICE_KEYS = ["buttery","airy","glassy","rounded"], PITCH = {buttery:1, airy:1.2, glassy:1, rounded:0.8};
function enVoices(){ try { return synth.getVoices().filter(function(v){ return /^en/i.test(v.lang); }); } catch(e){ return []; } }
function chunks(text){
  /* แบ่งข้อความยาวเป็นประโยค กันเบราว์เซอร์ตัดเสียงกลางทาง */
  if (text.length < 160) return [text];
  var out = [], cur = "";
  text.split(" ").forEach(function(w, i, arr){
    cur += (cur ? " " : "") + w;
    var next = arr[i + 1] || "";
    if (/[.!?]$/.test(w) && !/^(Mr|Ms|Mrs|Dr|A|P)\.$/.test(w) && !/^[AP]\.M\.$/.test(w) && /^[A-Z]/.test(next) && cur.length > 60){ out.push(cur); cur = ""; }
  });
  if (cur) out.push(cur);
  return out;
}
var playId = 0;
function playAudio(){
  var it = S.set && S.set.items[S.i];
  if (!synth || !it || !it.audio) return;
  S.audioErr = "";
  synth.cancel();
  var id = ++playId, voices = enVoices(), list = [];
  it.audio.forEach(function(l){ chunks(l.t).forEach(function(t){ list.push({t:t, v:l.v}); }); });
  function done(){ if (id !== playId) return; S.speaking = false; if (S.view === "quiz") renderApp(); }
  list.forEach(function(l, i){
    var u = new SpeechSynthesisUtterance(l.t);
    u.lang = "en-US"; u.rate = 0.95; u.pitch = PITCH[l.v] || 1;
    if (voices.length){ u.voice = voices[VOICE_KEYS.indexOf(l.v) % voices.length] || voices[0]; u.lang = u.voice.lang; }
    if (i === list.length - 1) u.onend = done;
    u.onerror = function(e){ if (id !== playId || (e && (e.error === "canceled" || e.error === "interrupted"))) return; S.audioErr = "เล่นเสียงไม่สำเร็จ ลองกดอีกครั้ง"; done(); };
    synth.speak(u);
  });
  S.speaking = true; renderApp();
}
function stopAudio(){ if (synth && S.speaking){ playId++; synth.cancel(); S.speaking = false; } }
function secOf(s){ return SECTIONS.filter(function(x){ return x.name === s.part || x.parts.some(function(p){ return p.part === s.part; }); })[0]; }
function setSecs(s){
  if (s.secs) return s.secs;
  var sec = secOf(s), rate = sec && sec.name === "Listening" ? 27 : 45;
  return Math.ceil(s.items.length * rate / 60) * 60;
}
function fmt(sec){ var m = Math.floor(sec / 60), r = sec % 60; return m + ":" + (r < 10 ? "0" : "") + r; }
var tick = null;
function stopTimer(){ if (tick){ clearInterval(tick); tick = null; } }
function timeLeft(){ return Math.max(0, Math.round((S.deadline - Date.now()) / 1000)); }
function startTimer(){
  stopTimer();
  tick = setInterval(function(){
    var left = timeLeft(), el = document.getElementById("timer");
    if (el) el.textContent = "เหลือ " + fmt(left);
    if (left <= 0){ S.timeUp = true; finish(); }
  }, 1000);
}
function openSetup(s){ stopTimer(); stopAudio(); S.view = "setup"; S.set = s; renderApp(); window.scrollTo(0,0); }
function start(s, timed){
  stopAudio(); S.view="quiz"; S.set=s; S.i=0; S.picked=null; S.wrong=[]; S.correct=0; S.tally={}; S.showScript=false; S.audioErr="";
  S.timed = !!timed; S.timeUp = false;
  if (timed){ S.deadline = Date.now() + setSecs(s) * 1000; startTimer(); } else stopTimer();
  renderApp(); window.scrollTo(0,0);
}
function finish(){
  stopTimer(); stopAudio();
  var ids = {};
  S.set.items.forEach(function(it){ ids[it._sid] = true; });
  for (var id in ids) setBest(id, S.tally[id] || 0);
  S.view = "result"; renderApp(); window.scrollTo(0,0);
}
function renderSetup(){
  var s = S.set, secs = setSecs(s), sec = secOf(s);
  app.appendChild(h("section",{class:"card"},[
    h("span",{class:"muted",text:s.part}),
    h("h2",{text:s.title}),
    h("p",{text:s.items.length + " ข้อ · " + s.desc}),
    h("p",{text:"ต้องการจับเวลาหรือไม่"}),
    h("div",{class:"row"},[
      h("button",{class:"btn",text:"จับเวลา " + Math.round(secs / 60) + " นาที",onclick:function(){ start(s, true); }}),
      h("button",{class:"btn ghost",text:"ไม่จับเวลา",onclick:function(){ start(s, false); }})
    ]),
    h("p",{class:"muted",text: s.full ? "เวลาเท่ากับสอบจริง หมดเวลาแล้วระบบส่งคำตอบให้ทันที ข้อที่ยังไม่ได้ทำนับเป็นผิด"
      : "เวลาคิดตามสัดส่วนสอบจริง (" + (sec && sec.name === "Listening" ? "Listening 100 ข้อ 45 นาที" : "Reading 100 ข้อ 75 นาที") + ") หมดเวลาแล้วระบบส่งคำตอบให้ทันที"}),
    h("div",{class:"row"},[ h("button",{class:"btn ghost",text:"← กลับ",onclick:function(){ S.view = "home"; renderApp(); }}) ])
  ]));
}

function renderQuiz(){
  var s = S.set, it = s.items[S.i], done = S.picked != null;
  var kids = [
    h("div",{class:"row"},[
      h("button",{class:"btn ghost", text:"← ชุดข้อสอบ", onclick:function(){ stopTimer(); stopAudio(); S.view="home"; renderApp(); }}),
      h("span",{class:"muted", text:(it._part || s.part) + " · ข้อ " + (S.i+1) + " จาก " + s.items.length}),
      S.timed ? h("span",{class:"pill timer", id:"timer", text:"เหลือ " + fmt(timeLeft())}) : null
    ]),
    h("div",{class:"bar"},[ h("i",{style:"width:" + Math.round((S.i + (done?1:0)) / s.items.length * 100) + "%"}) ])
  ];
  var hide = false;
  if (it.p) kids.push(h("div",{class:"passage",text:it.p}));
  if (it.photo) kids.push(h("div",{class:"fig"},[ h("img",{src:it.photo, alt:it.alt || ""}) ]));
  if (it.img){ var fig = h("div",{class:"fig"}); fig.innerHTML = it.img; kids.push(fig); }
  if (it.audio){
    var showScript = done || S.showScript || S.tts === false;
    hide = !!it.spoken && !showScript;
    kids.push(h("div",{class:"row"},[
      S.tts === null ? h("button",{class:"btn",disabled:true,text:"กำลังเตรียมเสียง…"})
        : S.tts ? h("button",{class:"btn",text: S.speaking ? "■ หยุดเสียง" : "▶ ฟังเสียง", onclick: S.speaking ? function(){ stopAudio(); renderApp(); } : playAudio}) : null,
      (!done && S.tts !== false) ? h("button",{class:"btn ghost",text: S.showScript ? "ซ่อนบทพูด" : "แสดงบทพูด", onclick:function(){ S.showScript = !S.showScript; renderApp(); }}) : null
    ]));
    if (S.tts === false) kids.push(h("p",{class:"muted",text:"เบราว์เซอร์นี้เล่นเสียงไม่ได้ จึงแสดงบทพูดให้อ่านแทน"}));
    if (S.audioErr) kids.push(h("p",{class:"muted",text:S.audioErr}));
    if (showScript) kids.push(h("div",{class:"passage",text: it.audio.map(function(l){ return (l.s ? l.s + ": " : "") + l.t; }).join("\n")}));
  }
  kids.push(h("p",{class:"q",text:it.q}));
  kids.push(h("div",{class:"opts"}, it.o.map(function(txt, idx){
    var cls = "opt";
    if (done && idx === it.a) cls += " right";
    else if (done && idx === S.picked) cls += " wrong";
    return h("button",{class:cls, disabled:done, onclick:function(){ pick(idx); }},[
      h("span",{class:"b",text:LETTERS[idx]}), h("span",{class: hide ? "muted" : "", text: hide ? "ฟังจากเสียง" : txt}) ]);
  })));
  if (done){
    var ok = S.picked === it.a;
    kids.push(h("div",{class:"exp"},[
      h("div",{class:"v " + (ok?"ok":"no"), text: ok ? "ถูกต้อง" : "ยังไม่ถูก คำตอบคือ (" + LETTERS[it.a] + ") " + it.o[it.a]}),
      h("p",{text:it.e})
    ]));
    kids.push(h("button",{class:"btn", id:"next", text: S.i + 1 < s.items.length ? "ข้อต่อไป" : "ดูผลคะแนน", onclick:next}));
  }
  app.appendChild(h("section",{class:"card"},kids));
  var n = document.getElementById("next"); if (n) n.focus({preventScroll:true});
}

function pick(idx){
  var it = S.set.items[S.i];
  stopAudio();
  S.picked = idx;
  if (idx === it.a){ S.correct++; S.tally[it._sid] = (S.tally[it._sid] || 0) + 1; } else S.wrong.push(S.i);
  renderApp();
}
function next(){
  stopAudio(); S.showScript = false; S.audioErr = "";
  if (S.i + 1 < S.set.items.length){ S.i++; S.picked = null; renderApp(); window.scrollTo(0,0); }
  else finish();
}

function renderResult(){
  var s = S.set, n = s.items.length;
  var kids = [
    h("span",{class:"muted",text:s.part + " · " + s.title}),
    h("div",{class:"score",text:S.correct + "/" + n}),
    (function(){
      var sec = secOf(s);
      var r = sec ? sectionScore(sec) : null;
      return r && r.score != null ? h("p",{},[ h("strong",{text:"คะแนน " + sec.name + " โดยประมาณ ≈" + r.score + " / 495"}), h("span",{class:"muted",text:" (จาก " + r.n + " ข้อที่ทำแล้ว)"}) ]) : null;
    })(),
    S.timeUp ? h("p",{},[ h("strong",{text:"หมดเวลา "}), "ยังไม่ได้ทำ " + (n - S.correct - S.wrong.length) + " ข้อ นับเป็นผิด" ]) : null,
    h("p",{text: S.correct === n ? "ถูกทุกข้อ ลองชุดถัดไปได้เลย" : "ทบทวนข้อที่พลาดด้านล่าง แล้วลองทำซ้ำอีกรอบ"})
  ];
  S.wrong.forEach(function(i){
    var it = s.items[i];
    kids.push(h("div",{class:"miss"},[
      h("strong",{text:"ข้อ " + (i+1) + " · ตอบ (" + LETTERS[it.a] + ") " + it.o[it.a]}),
      h("span",{class:"muted",text:it.e})
    ]));
  });
  kids.push(h("div",{class:"row"},[
    h("button",{class:"btn",text:"ทำชุดนี้อีกครั้ง",onclick:function(){ openSetup(s); }}),
    h("button",{class:"btn ghost",text:"เลือกชุดอื่น",onclick:function(){ S.view="home"; renderApp(); }})
  ]));
  app.appendChild(h("section",{class:"card"},kids));
}

/* ---------- เปิด-ปิดเว็บ: อ่านจากไฟล์ config.json ---------- */
S.tts = !!synth;
if (synth){ try { synth.getVoices(); synth.onvoiceschanged = function(){}; } catch(e){} }
(function init(){
  function apply(c){
    S.access = c && c.open === false ? "closed" : "open";
    S.message = c && typeof c.message === "string" ? c.message : "";
    render();
  }
  var done = false, timer = setTimeout(function(){ if (!done){ done = true; apply(null); } }, 6000);
  try {
    fetch("config.json?t=" + Date.now(), {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(c){
      if (done) return; done = true; clearTimeout(timer); apply(c);
    }, function(){ if (done) return; done = true; clearTimeout(timer); apply(null); });
  } catch(e){ done = true; clearTimeout(timer); apply(null); }
})();
render();
</script>
